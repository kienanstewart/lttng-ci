---
- name: "Dist upgrade and optional reboot"
  hosts: all
  vars:
    restart: 'no'
    reboot_wait: 300

  vars_prompt:
    - name: reboot
      prompt: "Enter 'yes' to reboot"
      default: 'no'
      private: false

  tasks:
    - name: "Run apt update && apt dist-upgrade && apt clean && apt autoremove --purge"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        clean: true
        autoremove: true
        purge: true

    - name: "Reboot server"
      ansible.builtin.command:
        cmd: '/sbin/reboot'
      async: 0
      poll: 0
      ignore_errors: true
      when: reboot == "yes"
      register: last_result

    - name: Wait for the server to reboot
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        delay: 1
        timeout: 300
        state: started
      # noqa: no-handler
      when: last_result.changed
      become: false
