---
- name: Add trixie-backports block
  when: ansible_distribution == 'Debian' and ansible_distribution_major_version == "13"
  block:
    - name: Add trixie-backports
      ansible.builtin.apt_repository:
        repo: 'deb https://deb.debian.org/debian trixie-backports main'
    - name: Add unattended-upgrades configuration for trixie-backports
      ansible.builtin.copy:
        content: "Unattended-Upgrade::Origins-Pattern:: \"origin=Debian Backports,codename=${distro_codename}-backports,label=Debian Backports\";\n"
        dest: /etc/apt/apt.conf.d/90unattended_upgrades-backports.conf
        owner: root
        group: root
        mode: '0644'
    - name: Update APT
      ansible.builtin.apt:
        update_cache: true

- name: Install lava-server
  ansible.builtin.apt:
    name:
      - lava-server
      - libvirt-clients
- name: Enable apache modules
  ansible.builtin.command:
    argv: ['a2enmod', item]
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - proxy
    - proxy_http
    - ssl
  notify:
    - Restart apache
- name: Disable default apache2 site
  ansible.builtin.file:
    path: /etc/apache2/sites-enable/000-default.conf
    state: absent
  notify:
    - Reload apache
- name: Enable lava-server site
  ansible.builtin.command:
    argv: ['a2ensite', 'lava-server.conf']
    creates: /etc/apache2/sites-enabled/lava-server.conf
  notify:
    - Reload apache
- name: Deploy internal certificate
  ansible.builtin.import_role:
    name: common
    tasks_from: certs
  notify:
    - Reload apache
  tags:
    - certs
- name: Create TLS vhost
  ansible.builtin.copy:
    src: vhost-tls.conf
    dest: /etc/apache2/sites-enabled/lava-server-tls.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload apache
- name: Configure lava-server allowed hosts
  ansible.builtin.template:
    src: allowed_hosts.yaml.j2
    dest: /etc/lava-server/settings.d/00-hosts.yaml
    owner: lavaserver
    group: lavaserver
    mode: '0640'
  notify:
    - Restart lava-server-gunicorn
- name: Configure lava-server LDAP integration
  ansible.builtin.template:
    src: ldap.yaml.j2
    dest: /etc/lava-server/settings.d/01-ldap.yaml
    owner: lavaserver
    group: lavaserver
    mode: '0640'
  notify:
    - Restart lava-server-gunicorn
- name: Add lava devices
  ansible.builtin.include_tasks: enable_device.yml
  loop:
    - qemu
    - x86
    - imx6q-wandboard
    - cubietruck
- name: Deploy lava device configuration
  ansible.builtin.template:
    src: device.jinja2.j2
    dest: "/etc/lava-server/dispatcher-config/devices/{{ item.name }}.jinja2"
    owner: root
    group: lavaserver
    mode: '0640'
  with_items: "{{ lava_server_devices | default([]) }}"
- name: Generate root SSH keypair
  # The public key can be installed on qemu hosts
  # lava-worker runs as root, not as lavaserver.
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
