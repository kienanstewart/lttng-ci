---
- name: Reload apache
  ansible.builtin.command:
    argv: ['apache2ctl', 'graceful']
  changed_when: true
- name: Restart apache
  ansible.builtin.service:
    name: apache2
    state: restarted
- name: Restart lava-server-gunicorn
  ansible.builtin.service:
    name: lava-server-gunicorn
    state: restarted
