---
- name: Reload apache
  ansible.builtin.command:
    argv: ['apache2ctl', 'graceful']
  changed_when: true
- name: Restart apache
  ansible.builtin.systemd:
    name: apache2
    state: restarted
- name: Restart git-daemon
  ansible.builtin.systemd:
    name: git-daemon
    state: restarted
- name: Restart grok-pull
  ansible.builtin.systemd:
    name: "grok-pull@{{ git_mirror_instance_name }}"
    state: restarted
