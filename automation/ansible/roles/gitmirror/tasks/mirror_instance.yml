---
- name: Create storage directory
  ansible.builtin.file:
    path: "{{ gitmirror_instance_mirror.core.toplevel }}"
    state: directory
    owner: gitdaemon
    group: gitdaemon
    mode: '0755'

- name: Deploy config file
  ansible.builtin.template:
    dest: "/etc/grokmirror/{{ gitmirror_instance_name }}.conf"
    src: grokmirror.conf.j2
    owner: root
    group: root
    mode: '0644'
  vars:
    gitmirror_instance_name: "{{ gitmirror_instance_name }}"
    gitmirror_instance_data: "{{ gitmirror_grokmirror_instance_defaults | combine(gitmirror_instance_mirror, recursive=true) }}"
  notify:
    - Restart grok-pull

- name: Systemd service
  ansible.builtin.systemd:
    name: "grok-pull@{{ gitmirror_instance_name }}"
    state: started
    enabled: true
