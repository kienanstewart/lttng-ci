---
- name: Install cgit
  ansible.builtin.apt:
    name: ['cgit', 'apache2']
- name: Include certs
  ansible.builtin.import_role:
    name: common
    tasks_from: certs
  tags:
    - certs
  notify:
    - Reload apache
- name: Configure cgit
  ansible.builtin.template:
    src: cgitrc.j2
    dest: /etc/cgitrc
    owner: root
    group: root
    mode: '0644'
- name: Configure apache2
  block:
    - name: Enable cgit configuration
      ansible.builtin.command:
        argv: ['a2enconf', 'cgit.conf']
        creates: /etc/apache2/conf-enabled/cgit.conf
      notify:
        - Restart apache
    - name: Disable default site
      ansible.builtin.command:
        argv: ['a2dissite', '000-default.conf']
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify:
        - Restart apache
    - name: Enable https
      ansible.builtin.command:
        argv: ['a2enmod', 'ssl']
        creates: '/etc/apache2/mods-enabled/ssl.conf'
      notify:
        - Restart apache
    - name: Enable cgid
      ansible.builtin.command:
        argv: ['a2enmod', 'cgid']
        creates: '/etc/apache2/mods-enabled/cgid.conf'
      notify:
        - Restart apache
    - name: Manage apache2 cgit site configuration
      ansible.builtin.template:
        src: apache2.conf.j2
        dest: /etc/apache2/sites-available/cgit.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - Restart apache
    - name: Enable cgit site configuration
      ansible.builtin.command:
        argv: ['a2ensite', 'cgit.conf']
        creates: /etc/apache2/sites-enabled/cgit.conf
      notify:
        - Restart apache
- name: Install git-daemon
  ansible.builtin.apt:
    name: ['git-daemon-sysvinit']
- name: Create gitdaemon group
  ansible.builtin.group:
    name: gitdaemon
    system: true
- name: Create git-daemon base path
  when: gitmirror_git_daemon_conf.GIT_DAEMON_BASE_PATH | length > 0
  ansible.builtin.file:
    path: "{{ gitmirror_git_daemon_conf.GIT_DAEMON_BASE_PATH }}"
    state: directory
    owner: gitdaemon
    group: gitdaemon
    mode: '0644'
- name: Configure git-daemon
  with_items: "{{ gitmirror_git_daemon_conf | dict2items }}"
  community.general.ini_file:
    path: /etc/default/git-daemon
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart git-daemon
- name: Create git-daemon group
  ansible.builtin.group:
    system: true
    name: gitdaemon
- name: Add www-data to the git-daemon group
  ansible.builtin.user:
    name: www-data
    append: true
    groups: ['gitdaemon']
- name: Install grokmirror
  when: ansible_distribution_release != 'bookworm'
  ansible.builtin.apt:
    name: grokmirror
- name: Install grokmirror from local deb
  when: ansible_distribution_release == 'bookworm'
  block:
    - name: Download grokmirror deb
      ansible.builtin.copy:
        src: files/grokmirror_2.0.11-1_all.deb
        dest: /root/grokmirror.deb
        owner: root
        group: root
        mode: '0644'
      register: gitmirror_grokmirror_deb
    - name: Install from deb file
      when: gitmirror_grokmirror_deb.changed  # noqa: no-handler
      ansible.builtin.command:
        argv: ['apt', 'install', '-y', '/root/grokmirror.deb']
      changed_when: true
- name: Create grokmirror configuration directory
  ansible.builtin.file:
    state: directory
    dest: /etc/grokmirror
    owner: root
    group: root
    mode: '0644'
- name: Create grokmirror log directory
  ansible.builtin.file:
    state: directory
    dest: /var/log/grokmirror
    owner: gitdaemon
    group: root
    mode: '0755'
- name: Create gitdaemon storage directory
  ansible.builtin.file:
    state: directory
    dest: /storage/git-mirror/gitdaemon
    owner: gitdaemon
    group: gitdaemon
    mode: '0755'
- name: Create grokmirror configs
  ansible.builtin.include_tasks:
    file: mirror_instance.yml
  with_items: "{{ gitmirror_grokmirror_instances | dict2items }}"
  vars:
    gitmirror_instance_name: "{{ item.key }}"
    gitmirror_instance_mirror: "{{ item.value }}"
- name: Create legacy pull directory
  ansible.builtin.file:
    state: directory
    dest: /storage/git-mirror/gitdaemon/git
    owner: gitdaemon
    group: gitdaemon
    mode: '0755'
- name: Create legacy pull script
  ansible.builtin.copy:
    src: update.sh
    dest: /storage/git-mirror/gitdaemon/git/update.sh
    mode: '0750'
    owner: gitdaemon
    group: gitdaemon
- name: Install cron
  ansible.builtin.apt:
    name: cron
- name: Manage legacy pull cron job
  ansible.builtin.cron:
    name: gitmirror
    cron_file: gitmirror
    minute: '*/30'
    job: 'cd /storage/git-mirror/gitdaemon/git && ./update.sh >/dev/null 2>&1'
    user: gitdaemon
- name: Link cgit export directories
  with_items: "{{ gitmirror_cgit_export_links | dict2items }}"
  ansible.builtin.file:
    state: link
    src: "{{ item.value }}"
    path: "/storage/git-mirror/gitdaemon/export/{{ item.key }}"
