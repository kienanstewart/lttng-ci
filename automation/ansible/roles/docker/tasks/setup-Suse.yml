---

- name: Add SLES products
  when: ansible_distribution == 'SLES'
  ansible.builtin.include_role:
    name: suse
    tasks_from: product
  loop: "{{ docker_sles_products }}"
  loop_control:
    loop_var: product

- name: Set docker_packages fact
  ansible.builtin.set_fact:
    docker_packages: "{{ docker_sles_packages }}"
