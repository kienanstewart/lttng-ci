---
- name: Activate SLES Products
  when: ansible_distribution == 'SLES'
  ansible.builtin.include_role:
    name: suse
    tasks_from: product
  loop:
    - PackageHub
  loop_control:
    loop_var: 'product'

- name: Ensure lttng-tools build dependencies are installed.
  community.general.zypper:
    name: "{{ lttng_tools_packages }}"
    update_cache: true

- name: Ensure lttng-tools build dependencies are installed (no recommends).
  community.general.zypper:
    name: "{{ lttng_tools_packages_no_recommends }}"
    disable_recommends: true
