---
- name: Upgrade packages
  when: common_upgrade_all_packages
  ansible.builtin.apt:
    state: latest  # noqa: package-latest
    update_cache: true
    upgrade: true

- name: Add LTTng-CI PPA
  # This provides gdb with no babeltrace; however, it's only made
  # available for certain releases
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22']
  block:
    - name: LTTng-CI PPA | apt key
      ansible.builtin.copy:
        src: efficios_ubuntu_ci.gpg
        dest: /etc/apt/trusted.gpg.d/efficios_ubuntu_ci.gpg
        owner: root
        group: root
        mode: '0644'

    - name: LTTng-CI PPA | apt source
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/trusted.gpg.d/efficios_ubuntu_ci.gpg] http://ppa.launchpad.net/efficios/ci/ubuntu {{ ansible_distribution_release }} main"
        state: present
        filename: efficios-ubuntu-ci

- name: Update apt cache.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Ensure common packages are installed.
  ansible.builtin.apt:
    name: "{{ common_packages }}"

- name: Install unattended upgrades
  ansible.builtin.apt:
    name: 'unattended-upgrades'
    state: "{{ common_unattended_upgrades | ternary('present', 'absent') }}"

- name: Enable extra repos for unattended upgrades
  ansible.builtin.template:
    dest: /etc/apt/apt.conf.d/51unattended_upgrades_extra_repos.conf
    src: unattended_upgrades_extra_repos.conf.j2
    mode: '0644'
  vars:
    repos_base:
      - "${distro_id}:${distro_codename}-updates"
      - "${distro_id}:${distro_codename}-backports"
    repos_ubuntu:
      - "LP-PPA-efficios-ci:${distro_codename}"
    repos_debian: []
    repos: "{{ repos_base | union(lookup('vars', 'repos_' + (ansible_distribution | lower), default=[])) | sort }}"

- name: Enable unattended upgrades
  block:
    - name: Set auto-upgrades configuration
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: "APT::Periodic::Update-Package-Lists \"1\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n"
        owner: root
        group: root
        mode: '0644'
      when: common_unattended_upgrades
      ignore_errors: "{{ ansible_check_mode }}"
    - name: Remove auto-upgrades configuration
      ansible.builtin.file:  # noqa: risky-file-permissions
        path: /etc/apt/apt.conf.d/20auto-upgrades
        state: "{{ common_unattended_upgrades | ternary('file', 'absent') }}"
      ignore_errors: "{{ ansible_check_mode }}"
- name: Install microcode for physical hosts
  when: ansible_virtualization_role == 'host'
  block:
    - name: Install AMD microcode
      when: "'AuthenticAMD' in ansible_processor"
      ansible.builtin.apt:
        name: amd64-microcode
      register: common_amd64_microcode
    - name: Install Intel microcode
      when: "'GenuineIntel' in ansible_processor"
      ansible.builtin.apt:
        name: intel-microcode
      register: common_intel_microcode
    - name: Update initramfs
      when: common_amd64_microcode.changed or common_intel_microcode.changed
      ansible.builtin.command:
        argv: ['update-initramfs', '-u', '-k', 'all']
      register: common_update_initramfs
      changed_when: common_update_initramfs.rc == 0
    - name: Set reboot required
      when: common_amd64_microcode.changed or common_intel_microcode.changed
      ansible.builtin.copy:
        dest: /var/run/reboot-required
        content: '*** System restart required ***'
        owner: root
        group: root
        mode: '0644'
- name: Install prometheus node exporter for physical hosts
  when: "'hosts' in group_names"
  tags:
    - monitoring
  block:
    - name: Install prometheus exporter packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - prometheus-node-exporter-collectors
    - name: Configuration prometheus node exporter
      ansible.builtin.lineinfile:
        line: "ARGS={{ common_prometheus_node_exporter_args | quote }}"
        path: /etc/default/prometheus-node-exporter
      notify:
        - 'Restart prometheus-node-exporter'
    - name: Enable prometheus-node-exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        enabled: true
        state: started

- name: Work-around for git hanging during checkouts
  # @see https://support.efficios.com/issues/1532
  when: ansible_distribution_release == 'bookworm'
  block:
    - name: Use HTTP/1.1 with git HTTP operations
      community.general.git_config:
        file: '/etc/gitconfig'
        name: 'http.version'
        value: 'HTTP/1.1'

- name: Install promtail
  when: common_install_promtail
  tags:
    - monitoring
  block:
    - name: Add apt source
      block:
        - name: Install signing key
          ansible.builtin.copy:
            dest: /etc/apt/keyrings/grafana.gpg
            src: grafana.gpg
            owner: root
            group: root
            mode: '0644'
          register: common_signing_key
        - name: Add apt source
          ansible.builtin.apt_repository:
            filename: grafana
            repo: 'deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main'
          register: common_apt_source
        - name: Apt update
          when: common_signing_key.changed or common_apt_source.changed
          ansible.builtin.apt:
            update_cache: true
    - name: Install promtail
      ansible.builtin.package:
        name: ['promtail']
    - name: Allow promtail user to read logs
      ansible.builtin.user:
        name: promtail
        append: true
        groups:
          - systemd-journal
    - name: Configure promtail
      ansible.builtin.template:
        src: promtail.config.yml.j2
        dest: '/etc/promtail/config.yml'
        owner: 'root'
        group: 'root'
        mode: '0644'
      notify:
        - 'Restart promtail'
    - name: Manage promtail service
      ansible.builtin.service:
        name: 'promtail'
        enabled: true
        state: started
