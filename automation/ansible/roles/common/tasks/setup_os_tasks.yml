---

# If parent roles names doesn't have a value, fail
- name: Fail is not called from include_role
  when: ansible_parent_role_names | length == 0
  ansible.builtin.fail:
    msg: "Must be called from include_role"
  tags:
    - always

- name: Set rolename to use
  ansible.builtin.set_fact:
    common_include_setup_tasks_role: "{{ ansible_parent_role_names[0] }}"

# Setup/install tasks.
- name: Include EL tasks
  when: ansible_facts['os_family'] in ['RedHat', 'Rocky']
  ansible.builtin.include_role:
    role: "{{ common_include_setup_tasks_role }}"
    tasks_from: setup-RedHat.yml
  tags:
    - always

- name: Include Debian tasks
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.include_role:
    role: "{{ common_include_setup_tasks_role }}"
    tasks_from: setup-Debian.yml
  tags:
    - always

- name: Include Alpine tasks
  when: ansible_facts['os_family'] == 'Alpine'
  ansible.builtin.include_role:
    role: "{{ common_include_setup_tasks_role }}"
    tasks_from: setup-Debian.yml
  tags:
    - always

- name: Include SUSE tasks
  when: ansible_facts['os_family'] == 'Suse'
  ansible.builtin.include_role:
    role: "{{ common_include_setup_tasks_role }}"
    tasks_from: setup-RedHat.yml
  tags:
    - always
