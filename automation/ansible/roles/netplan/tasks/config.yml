---
- name: Install item dependencies
  when: item.dependencies | default([])
  ansible.builtin.package:
    name: "{{ item.dependencies }}"
    install_recommends: false

- name: Create netplan configuration file
  when: state == 'present'
  ansible.builtin.template:
    src: "netplan.yaml.j2"
    dest: "{{ filename }}"
    mode: '0600'
    owner: 'root'
    group: 'root'
  notify:
    - 'Apply netplan'

- name: Manage state of netplan configuration file
  when: state != 'present'
  ansible.builtin.file:
    path: "{{ filename }}"
    state: "{{ state }}"
    owner: root
    group: root
    mode: '0600'
  notify:
    - 'Apply netplan'
