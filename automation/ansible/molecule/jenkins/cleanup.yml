---

- name: Add hosts to jenkins group
  hosts: all
  gather_facts: true
  vars:
    molecule_skipped_scenarios: "{{ (molecule_skip_scenarios | default([])) | difference(molecule_include_scenarios | default([])) }}"
    runtime_inventory_dir: "{{ molecule_ephemeral_directory + '/runtime_inventory' }}"
  tasks:
    - name: End hosts that skip this scenario
      ansible.builtin.meta: end_host
      when: "'jenkins' in molecule_skipped_scenarios"
    - name: Add host to the jenkins group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - jenkins
      loop: "{{ ansible_play_batch }}"
      # Never signal a change for this, since it breaks the idempotence step
      changed_when: false

- name: Cleanup post-test
  hosts: jenkins
  tasks:
    - name: Remove per-host Jenkins configuration
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ runtime_inventory_dir }}/host_vars/{{ item }}/jenkins.yml"
        state: absent
      loop: "{{ ansible_play_batch }}"
