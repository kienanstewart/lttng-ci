---
- name: Create instances
  hosts: localhost
  connection: local
  vars:
    default_remote: "{{ ansible_incus_remote | default(lookup('ansible.builtin.env', 'ANSIBLE_INCUS_REMOTE', default='local')) }}"
    default_profile: "{{ ansible_incus_profile | default('default') }}"
    default_project: "{{ ansible_incus_project | default('default') }}"
    # This includes the scenario name, unless invoked with MOLECULE_EPHEMERAL_DIRECTORY=x
    instance_suffix: "{{ molecule_ephemeral_directory | basename | regex_replace('[^a-zA-Z0-9]+', '') }}"
    runtime_inventory_dir: "{{ molecule_ephemeral_directory + '/runtime_inventory' }}"
    scenario_name: "{{ molecule_yml.scenario.name }}"
    scenario_name_clean: "{{ molecule_yml.scenario.name | regex_replace('[^a-zA-Z0-9]+', '') }}"
    shared_state: "{{ molecule_yml.shared_state | default(false) }}"
  tasks:
    - name: End if there are no items in test_resources
      when: "'test_resources' not in groups"
      ansible.builtin.meta: end_play
    - name: List instances
      ansible.builtin.command:
        argv:
          - incus
          - ls
          - "{{ default_remote | ternary(default_remote + ':', '') }}"
          - '--format=json'
      register: _incus_ls
      changed_when: false
    - name: Add scenario to instance suffix
      when: not shared_state and scenario_name_clean not in instance_suffix
      ansible.builtin.set_fact:
        instance_suffix: "{{ instance_suffix + '-' + scenario_name_clean }}"
    - name: Create instance
      when: "_incus_ls.stdout | from_json | selectattr('project', 'equalto', hostvars[item]['project'] | default(default_project)) | selectattr('name', 'equalto', instance_name) | list | length == 0"
      ansible.builtin.command:
        argv:
          - incus
          - launch
          - "--ephemeral={{ hostvars[item]['ephemeral'] | default(true) | ternary('true', 'false') }}"
          - "--vm={{ hostvars[item]['vm'] | default(false) | ternary('true', 'false') }}"
          - "--project={{ hostvars[item]['project'] | default(default_project) }}"
          - "--profile={{ hostvars[item]['profile'] | default(default_profile) }}"
          - "{{ hostvars[item]['image'] }}"
          - "{{ hostvars[item]['remote'] | default(default_remote) + ':' }}{{ instance_name }}"
      loop: "{{ groups['test_resources'] }}"
      vars:
        instance_name: "{{ item + '-' + instance_suffix }}"
      changed_when: true
    - name: Make runtime dir
      ansible.builtin.file:
        state: directory
        path: "{{ runtime_inventory_dir }}/host_vars/{{ item }}"
        recurse: true
      loop: "{{ groups['test_resources'] }}"
    - name: Write host vars
      # @see https://docs.ansible.com/projects/molecule/ansible-native/#collection-based-resource-management
      ansible.builtin.copy:
        # noqa: risky-file-permissions
        content: |
          ansible_incus_host: "{{ instance_name }}"
          ansible_incus_remote: "{{ hostvars[item]['remote'] | default(default_remote) }}"
        dest: "{{ runtime_inventory_dir }}/host_vars/{{ item }}/runtime.yml"
        mode: '0644'
      loop: "{{ groups['test_resources'] }}"
      vars:
        instance_name: "{{ item + '-' + instance_suffix }}"
    - name: Add hosts to current play
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_incus_host: "{{ instance_name }}"
        ansible_incus_remote: "{{ hostvars[item]['remote'] | default(default_remote) }}"
      loop: "{{ groups['test_resources'] }}"
      vars:
        instance_name: "{{ item + '-' + instance_suffix }}"
    - name: Wait for instance online
      # It can take some time before instances, especially VMs, are available.
      ansible.builtin.command:
        argv:
          - incus
          - exec
          - "{{ hostvars[item]['remote'] | default(default_remote) + ':' }}{{ instance_name }}"
          - '--'
          - 'true'
      vars:
        instance_name: "{{ item + '-' + instance_suffix }}"
      retries: 5
      delay: 10
      loop: "{{ groups['test_resources'] }}"
      changed_when: false

- name: Update hostnames
  hosts: test_resources
  # Incus instances will often have the instance name as the hostname by default.
  # Update the hostname so that it matches the inventory hostname instead.
  tasks:
    # Use copy instead of ansible.builtin.hostname, which errors out with tox parallel
    # executions: Failed to connect to system scope bus via local transport ansible: no
    # such file or directory.
    - name: Update instance hostname
      ansible.builtin.copy:
        dest: /etc/hostname
        content: "{{ inventory_hostname }}"
        owner: root
        group: root
        mode: '0644'
