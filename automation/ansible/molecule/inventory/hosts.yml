---

all:
  vars:
    # Don't run these scenarios on hosts by default
    # Pertinent hosts should add an entry to 'molecule_include_scenarios'
    # if the scenario is pertinent to them
    molecule_skip_scenarios:
      - gitmirror
      - jenkins
      - lava
  children:
    test_resources:
      hosts:
        debian-12-amd64:
          image: images:debian/12/cloud/amd64
          molecule_include_scenarios:
            - gitmirror
            - lava
          molecule_skip_scenarios:
            - ci_node
            - jenkins
        debian-13-amd64:
          image: images:debian/13/cloud/amd64
          molecule_include_scenarios:
            - jenkins
        debian-13-amd64-vm:
          image: images:debian/13/cloud/amd64
          vm: true
          molecule_include_scenarios:
            # Lava is here since it requires NFS which requires a VM or a container with
            # loosened security restrictions
            - lava
            - standalone
          molecule_skip_scenarios:
            - ci_node
            - gitmirror
            - jenkins
        debian-13-arm64:
          image: images:debian/13/cloud/arm64
        rocky-8-amd64:
          image: images:rockylinux/9/cloud/amd64
        rocky-9-amd64:
          image: images:rockylinux/9/cloud/amd64
        rocky-10-amd64:
          image: images:rockylinux/9/cloud/amd64
        rocky-10-arm64:
          image: images:rockylinux/9/cloud/arm64
