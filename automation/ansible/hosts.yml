---
- name: Include zfs & netplan roles
  hosts: hosts:!windows
  roles:
    # Setup filesystem and network configuration before other roles
    - zfs
    - netplan
- name: Include common role
  hosts: hosts
  roles:
    - common
- name: Include incus role
  hosts: hosts:&incus:!windows
  roles:
    - incus
- name: Include libvirt and rasdaemon roles
  hosts: hosts:!windows
  roles:
    - libvirt
    - rasdaemon
