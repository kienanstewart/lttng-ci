- defaults:
    name: babeltrace_benchmark
    project-type: freestyle
    description: |
      This job is responsible for triggering benchmark jobs in lava and generate the report

      The Babeltrace project provides trace read and write libraries, as well
      as a trace converter. Plugins can be created for any trace format to
      allow its conversion to/from another trace format.

      The main format expected to be converted to/from is the Common Trace
      Format (CTF). The default input format of the "babeltrace" command is
      CTF, and its default output format is a human-readable text log. The
      "babeltrace-log" command converts from a text log to a CTF trace.

      <p>Job is managed by Jenkins Job Builder.</p>

    node: 'deb13-amd64'

    wrappers:
      - ansicolor
      - timestamps
      - workspace-cleanup
      - credentials-binding:
          - text:
              credential-id: jenkins_lava2_key
              variable: LAVA2_JENKINS_TOKEN
          - username-password-separated:
              credential-id: s3_obj_lava_key
              username: S3_ACCESS_KEY
              password: S3_SECRET_KEY

    parameters:
      - string:
          name: 'KERNEL_COMMIT_ID'
          description: 'Commit ID of the linux kernel to use'
          default: 'f6044d1fd846ed1ae457975738267214b538a222'  # v6.12.66
      - string:
          name: 'LTTNG_CI_REPO'
          default: 'https://github.com/lttng/lttng-ci.git'
          description: 'LTTng-ci git repo to checkout the CI scripts'
      - string:
          name: 'LTTNG_CI_BRANCH'
          default: 'master'
          description: 'The branch of the CI repository to clone for job scripts'
      - bool:
          name: 'BENCHMARK_FORCE'
          default: false
          description: 'Force benchmarks to be re-run'
      - bool:
          name: 'BENCHMARK_SKIP_ASV_GENERATION'
          default: false
          description: 'Skip generating ASV output'
      - bool:
          name: 'BENCHMARK_SKIP_PDF_GENERATION'
          default: false
          description: 'Skip generating PDF output'
      - bool:
          name: 'BENCHMARK_SKIP_SUBMISSION'
          default: false
          description: 'Skip running benchmarks'
      - bool:
          name: 'BENCHMARK_TAGS_ONLY'
          default: true
          description: 'Limit benchmarked revisions to tags'
      - string:
          name: 'BENCHMARK_BATCH_SIZE'
          default: "100"
          description: "How many commits to test per lava run. 0 to test in a single run"
      - string:
          name: 'BENCHMARK_MAX_BATCHES'
          default: "0"
          description: "Maximum number of batches to run before ending job. 0 is all jobs"
      - string:
          name: 'NFS_ROOT_URL'
          default: 'https://obj-lava.internal.efficios.com/rootfs/rootfs_amd64_trixie_2025-09-25.tar.xz'
      - string:
          name: 'LAVA_USERNAME'
          default: 'lava-jenkins'
          description: 'The username to authenticate with the LAVA instance'
      - string:
          name: 'LAVA_HOST'
          default: 'lava-master-03.internal.efficios.com'
          description: 'The hostname of the LAVA instance'
      - choice:
          name: 'LAVA_PROTO'
          choices:
            - 'http'
            - 'https'
          description: 'The protocol to use with the LAVA host'
      - string:
          name: 'S3_HOST'
          description: 'Host for the s3 object storage'
          default: 'obj.internal.efficios.com'
      - string:
          name: 'S3_BUCKET'
          description: 'Bucket for the s3 object storage'
          default: 'lava'
      - string:
          name: 'S3_BASE_DIR'
          description: 'Base directory for the s3 object storage'
          default: 'system-tests'
      - string:
          name: 'S3_HTTP_BUCKET_URL'
          description: 'Base url to access the s3 bucket over unauthenticated HTTP'
          default: 'https://obj-lava.internal.efficios.com'

    scm:
      - git:
          url: https://github.com/efficios/babeltrace.git
          browser: githubweb
          browser-url: https://github.com/efficios/babeltrace
          basedir: src/babeltrace
          skip-tag: true
          branches:
            - origin/{version}

    # Job variables
    version: 'master'

- job-template:
    # The goal of this job is to run the benchmarks for the most recent
    # commit and compare to COMMIT~1 and the last tag (if any). The
    # job should warn or fail if there's a regression in any of the
    # benchmarks.
    name: 'babeltrace_{version}_benchmark_regression'
    defaults: babeltrace_benchmark
    project-type: pipeline
    sandbox: true
    dsl: !include-jinja2: pipelines/babeltrace/benchmark_regression.groovy.j2
    triggers:
      - pollscm:
          cron: "@hourly"

- job:
    name: babeltrace_benchmark
    defaults: babeltrace_benchmark
    triggers:
      - timed: '@daily'

    builders:
      - trigger-builds:
          -
            # This ensures that the kernel is built
            project:
              - system_tests_build_kernel_and_modules
            current_parameters: false
            block: true
            # The LTTNG_MODULES_COMMIT_ID is to satisfy this job, and not
            # used by this job (v2.14.3).
            predefined-parameters: |
              BUILD_DEVICE=baremetal
              KERNEL_COMMIT_ID=$KERNEL_COMMIT_ID
              LTTNG_MODULES_COMMIT_ID=0be94330d9e0bd2f6fffa4c54ece0677a9a64b59
      - shell:
          !include-raw-verbatim: scripts/babeltrace-benchmark/benchmark.sh

    publishers:
      - archive:
          artifacts: 'results/**'
          follow-symlinks: true
          allow-empty: true
      - html-publisher:
          name: 'Benchmarks (web)'
          dir: 'asv/'
          allow-missing: true
          files: 'index.html'
          # keep for past builds too
          keep-all: true
          link-to-last-build: true
      - workspace-cleanup:
          clean-if:
            - failure: false

- project:
    name: babeltrace-benchmark-regression
    version:
      - stable-2.0
      - stable-2.1
      - master
    jobs:
      - 'babeltrace_{version}_benchmark_regression': {}
