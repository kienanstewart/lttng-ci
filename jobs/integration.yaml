---

- job-template:
    name: 'lttng-tools-{version}-64bit_with_32bit_traced_application'
    description: |
      Multi-bitness (32/64) test scenario for traced applications only.

      <p>Job is managed by Jenkins Job Builder.</p>
    project-type: pipeline
    sandbox: true
    dsl:
      !include-jinja2: pipelines/integration/32_64_traced_application.groovy.j2
    triggers:
      - reverse:
          jobs:
            - 'lttng-tools_{version}_linuxbuild'
            - 'lttng-ust_{version}_portbuild'
          results: 'success'
    # Job variables
    agent_label: 'deb13-amd64-rootnode'
    build_label_amd64: 'deb13-amd64'
    build_label_i386: 'deb13-i386'
    urcu_version: 'master'
    babeltrace_version: 'master'

- job-template:
    name: '{prefix}integration_lttng-tools-{version}-32-64_testsuite'
    concurrent: '{review}'
    description: |
      Integration pipeline for multi-bitness scenario (32/64).
      This essentially tests frontier scenario where the bitness between component changes.

      <p>Job is managed by Jenkins Job Builder.</p>
    project-type: pipeline
    sandbox: true
    dsl:
      !include-jinja2: pipelines/integration/lttng-tools-_version_-32-64_testsuite.groovy.j2
    parameters:
      !j2-yaml: |
        {% if review|default(false) %}
        {% include 'common/review_parameters.yaml.inc' %}
        {% endif %}
        - string:
            name: LIBURCU_GIT_URL
            default: 'https://github.com/urcu/userspace-rcu'
        - string:
            name: LIBURCU_GIT_BRANCH
            default: '{urcu_version}'
        - string:
            name: LTTNG_MODULES_GIT_URL
            default: 'https://github.com/lttng/lttng-modules'
        - string:
            name: LTTNG_MODULES_GIT_BRANCH
            default: '{version}'
        - string:
            name: LTTNG_UST_GIT_URL
            default: 'https://github.com/lttng/lttng-ust'
        - string:
            name: LTTNG_UST_GIT_BRANCH
            default: '{version}'
        - string:
            name: LTTNG_TOOLS_GIT_URL
            default: 'https://github.com/lttng/lttng-tools'
        - string:
            name: LTTNG_TOOLS_GIT_BRANCH
            default: '{version}'
        - bool:
            name: 'RUN_64bit_canary'
            default: 'true'
            description: 'Run the 64-bit canary test'
        - bool:
            name: 'RUN_32bit_relayd'
            default: 'true'
            description: 'Run the tools w/ 32-bit relayd test'
        - bool:
            name: 'RUN_32bit_sessiond'
            default: 'true'
            description: 'The the tools w/ 32-bit sessiond test'
        - bool:
            name: 'VERBOSE_BABELTRACE'
            default: 'false'
            description: 'Enable verbose output for babeltrace'
        - bool:
            name: 'VERBOSE_LTTNG_CLIENT'
            default: 'false'
            description: 'Enable verbose output for the lttng client'
        - bool:
            name: 'VERBOSE_SESSIOND'
            default: 'false'
            description: 'Enable verbose sessiond and consumerd output'
        - bool:
            name: 'VERBOSE_RELAYD'
            default: 'false'
            description: 'Enable verbose relayd output'

    properties:
      - build-discarder:
          !j2-yaml: |
            {% if review %}
            {% include 'common/review_discarder.yaml.inc' %}
            {% else %}
            {% include 'common/default_discarder.yaml.inc' %}
            {% endif %}

    # Job variables
    checkout_label: 'deb13-amd64'
    build_label_amd64: 'deb13-amd64'
    build_label_i386: 'deb13-i386'
    prefix: ''
    test_label_amd64: 'deb13-amd64-rootnode'
    review: false


## Views
- view-template:
    name: 'Integration'
    view-type: list
    regex: 'integration[-_].*'


## Projects
- project:
    name: integration-32-64
    jobs:
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite': &tools_32_64_master
          version: master
          babelversion: stable-2.1
          urcu_version: master
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite': &tools_32_64_stable_2_15_and_2_14
          version:
            - stable-2.15
            - stable-2.14
          babelversion: stable-2.1
          urcu_version: stable-0.15
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite': &tools_32_64_stable_2_13
          version: stable-2.13
          babelversion: stable-2.0
          urcu_version: stable-0.13
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite':
          <<: *tools_32_64_master
          prefix: 'dev_review_'
          review: true
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite':
          <<: *tools_32_64_stable_2_15_and_2_14
          prefix: 'dev_review_'
          review: true
      - '{prefix}integration_lttng-tools-{version}-32-64_testsuite':
          <<: *tools_32_64_stable_2_13
          prefix: 'dev_review_'
          review: true
      - 'lttng-tools-{version}-64bit_with_32bit_traced_application':
          version: master
          babeltrace_version: stable-2.1
      - 'lttng-tools-{version}-64bit_with_32bit_traced_application':
          version:
            - stable-2.15
            - stable-2.14
            - stable-2.13
          babeltrace_version: stable-2.1
          urcu_version: stable-0.15
