- defaults:
    name: lttng-ust-benchmarks
    description: |

      <p>Job is managed by Jenkins Job Builder.</p>

    project-type: freestyle

    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor

    scm:
      - git:
          url: https://github.com/{github_user}/{github_name}.git
          browser: githubweb
          browser-url: https://github.com/{github_user}/{github_name}
          branches:
            - origin/{version}
          basedir: src/lttng-ust-benchmarks
          skip-tag: true

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=lttng-ust-benchmarks
      - build-discarder:
          num-to-keep: 10
          artifact-num-to-keep: 2
      - github:
          url: https://github.com/{github_user}/{github_name}

    # Job variables
    github_user: lttng
    github_name: lttng-ust-benchmarks
    version:
      - 'master'

- job:
    name: lttng-ust-benchmarks
    defaults: lttng-ust-benchmarks
    project-type: pipeline
    sandbox: true
    #
    # 1) check out lttng-ust and lttng-ci
    # 2) Using scripts in lttng-ci, determine the commits that aren't yet benchmarked
    #   * tags-only by default, option to run commits in branches
    # 4) Once the jobs are complete, rebuild the reports
    #
    triggers:
      - timed: '@daily'

    parameters:
      - string:
          name: 'BABELTRACE_REPO'
          default: "https://github.com/efficios/babeltrace.git"
      - string:
          name: 'BENCHMARK_BATCH_SIZE'
          default: "10"
          description: "How many commits to test per lava run. 0 to test in a single run"
      - bool:
          name: 'BENCHMARK_FORCE'
          default: false
          description: 'Force benchmarks to be re-run'
      - string:
          name: 'BENCHMARK_MAX_BATCHES'
          default: "0"
          description: "Maximum number of batches to run before ending job. 0 is all jobs"
      - bool:
          name: 'BENCHMARK_SKIP_ASV_GENERATION'
          default: false
          description: 'Skip generating ASV output'
      - bool:
          name: 'BENCHMARK_SKIP_PDF_GENERATION'
          default: false
          description: 'Skip generating PDF output'
      - bool:
          name: 'BENCHMARK_SKIP_SUBMISSION'
          default: false
          description: 'Skip running benchmarks'
      - bool:
          name: 'BENCHMARK_TAGS_ONLY'
          default: true
          description: 'Limit benchmarked revisions to tags'
      - string:
          name: 'KERNEL_COMMIT_ID'
          description: 'Commit ID of the linux kernel to use'
          default: 'f6044d1fd846ed1ae457975738267214b538a222'  # v6.12.66
      - string:
          name: 'LAVA_HOST'
          default: 'lava-master-03.internal.efficios.com'
          description: 'The hostname of the LAVA instance'
      - choice:
          name: 'LAVA_PROTO'
          choices:
            - 'http'
            - 'https'
          description: 'The protocol to use with the LAVA host'
      - string:
          name: 'LAVA_USERNAME'
          default: 'lava-jenkins'
          description: 'The username to authenticate with the LAVA instance'
      - string:
          name: 'LTTNG_CI_REPO'
          default: 'https://github.com/lttng/lttng-ci.git'
          description: 'LTTng-ci git repo to checkout the CI scripts'
      - string:
          name: 'LTTNG_CI_BRANCH'
          default: 'master'
          description: 'The branch of the CI repository to clone for job scripts'
      - string:
          name: 'LTTNG_MODULES_REPO'
          default: 'https://github.com/lttng/lttng-modules.git'
      - string:
          name: 'LTTNG_TOOLS_REPO'
          default: 'https://github.com/lttng/lttng-tools.git'
      - string:
          name: 'LTTNG_UST_REPO'
          default: 'https://github.com/lttng/lttng-ust.git'
      - string:
          name: 'LTTNG_UST_BENCHMARKS_REPO'
          default: 'https://github.com/lttng/lttng-ust-benchmarks.git'
      - string:
          name: 'LTTNG_UST_BENCHMARKS_BRANCH'
          default: 'master'
      - string:
          name: 'NFS_ROOT_URL'
          default: 'https://obj-lava.internal.efficios.com/rootfs/rootfs_amd64_trixie_2026-02-06.tar.xz'
      - string:
          name: 'S3_BASE_DIR'
          description: 'Base directory for the s3 object storage'
          default: 'system-tests'
      - string:
          name: 'S3_BUCKET'
          description: 'Bucket for the s3 object storage'
          default: 'lava'
      - string:
          name: 'S3_HOST'
          description: 'Host for the s3 object storage'
          default: 'obj.internal.efficios.com'
      - string:
          name: 'S3_HTTP_BUCKET_URL'
          description: 'Base url to access the s3 bucket over unauthenticated HTTP'
          default: 'https://obj-lava.internal.efficios.com'
      - string:
          name: 'URCU_REPO'
          default: 'https://github.com/urcu/userspace-rcu.git'

    dsl: !include-jinja2: pipelines/lttng-ust/benchmark.groovy.j2

## Templates
- job-template:
    name: lttng-ust-benchmarks_{version}_{buildtype}
    defaults: lttng-ust-benchmarks

    project-type: freestyle
    node: deb13-amd64

    triggers:
      - reverse:
          jobs:
            - liburcu_master_linuxbuild
            - lttng-tools_master_linuxbuild
            - lttng-ust_master_linuxbuild
          result: 'success'

    builders:
      - copyartifact:
          project: liburcu_master_linuxbuild/platform=deb13-amd64,build=std,conf=std
          which-build: last-successful
          stable: false
          filter: 'build/**'
          target: 'deps/liburcu'
          do-not-fingerprint: true
      - copyartifact:
          project: babeltrace_{babeltrace_version}_linuxbuild/platform=deb13-amd64,build=std,conf=std
          which-build: last-successful
          stable: false
          filter: 'build/**'
          target: 'deps/babeltrace'
          do-not-fingerprint: true
      - copyartifact:
          project: lttng-tools_master_linuxbuild/platform=deb13-amd64,babeltrace_version={babeltrace_version},build=std,conf=agents,liburcu_version=master
          which-build: last-successful
          stable: false
          filter: 'build/**'
          target: 'deps/lttng-tools'
          do-not-fingerprint: true
      - copyartifact:
          project: lttng-ust_master_linuxbuild/platform=deb13-amd64,build=std,conf=std,liburcu_version=master/
          which-build: last-successful
          stable: false
          filter: 'build/**'
          target: 'deps/lttng-ust'
          do-not-fingerprint: true
      - shell:
         !include-raw-verbatim: scripts/lttng-ust-benchmarks/build.sh

    # TODO: Scan for open tasks
    publishers:
      - archive:
          artifacts: 'src/lttng-ust-benchmarks/benchmarks.json'
          allow-empty: false
      - plot:
         - title: Process Start Time Overhead (app with 1 TP)
           group: Benchmarks
           yaxis: s
           style: line
           series:
             - file: jenkins_plot_data/8_cpus.basic.tracing_disabled.start_overhead_s.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.basic.tracing_enabled.start_overhead_s.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.sha2.tracing_disabled.start_overhead_s.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.sha2.tracing_enabled.start_overhead_s.properties
               format: properties
         - title: Event Overhead (app with 1 TP)
           group: Benchmarks
           yaxis: ns/event
           style: line
           series:
             - file: jenkins_plot_data/8_cpus.basic.tracing_disabled.ns_per_event.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.basic.tracing_enabled.ns_per_event.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.sha2.tracing_disabled.ns_per_event.properties
               format: properties
             - file: jenkins_plot_data/8_cpus.sha2.tracing_enabled.ns_per_event.properties
               format: properties
               label: SHA-256 benchmark (tracing enabled)
      - workspace-cleanup:
          clean-if:
            - failure: false
            - not-built: false

## Project
- project:
    name: lttng-ust-benchmarks
    jobs:
      - 'lttng-ust-benchmarks_{version}_{buildtype}':
          buildtype: linuxbuild
          babeltrace_version: stable-2.1

