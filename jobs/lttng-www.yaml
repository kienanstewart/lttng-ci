- defaults:
    name: lttng-www
    project-type: pipeline
    sandbox: true
    dsl: !include-jinja2: pipelines/websites/lttng-www.groovy.j2
    description: |
      This job is responsible for updating the lttng website.

      <p>Job is managed by Jenkins Job Builder.</p>

    parameters: !j2-yaml: |
      - string:
          name: 'BUILD_TARGET'
          default: '{build_target}'
      - credentials:
          name: 'DEPLOY_CREDENTIALS'
          type: sshkey
          default: '{deploy_credentials}'
      - credentials:
          name: 'DEPLOY_KNOWN_HOSTS'
          default: '{deploy_known_hosts}'
      - string:
          name: 'DEPLOY_TARGET'
          default: '{deploy_target}'
      - string:
          name: 'GIT_URL'
          default: '{git_url}'
      - credentials:
          name: 'GIT_CREDENTIALS'
          type: sshkey
          default: '{git_credentials}'
      - string:
          name: 'GIT_BRANCH'
          default: '{version}'
      {% if review %}
      {% include 'common/review_parameters.yaml.inc' %}
      - credentials:
          name: 'REVIEW_KNOWN_HOSTS'
          default: '{review_known_hosts}'
      - string:
          name: 'REVIEW_GIT_URL'
          default: '{review_git_url}'
      - credentials:
          name: 'REVIEW_GIT_CREDENTIALS'
          type: sshkey
          default: '{review_git_credentials}'
      {% endif %}

    properties:
      !j2-yaml: |
        {% if review %}
        - build-discarder:
            !include: common/review_discarder.yaml.inc
        {% else %}
        - build-discarder:
            !include: common/default_discarder.yaml.inc
        {% endif %}

    scm:
      - git:
          url: '{git_url}'
          credentials-id: '{git_credentials}'
          basedir: src/lttng-www
          branches:
            - '{version}'
          skip-tag: true

    triggers: !j2-yaml: |
      {% if review %}
      - gerrit:
          trigger-on:
            - comment-added-event:
                approval-category: 'CI-Build'
                approval-value: 1
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'lttng-www'
              branches:
                - branch-compare-type: 'ANT'
                  branch-pattern: '{version}'
      {% else %}
      - pollscm:
          cron: '@hourly'
      - timed: '@daily'
      {% endif %}

    wrappers:
      - ansicolor
      - timestamps

    # Job variables
    build_target: 'prod'
    deploy_target: 'prod'
    deploy_credentials: 63a5abb5-9056-47e2-b419-f5946c1b8f08
    deploy_known_hosts: d023f830-9ab0-409f-b977-8cd0e1944dd5
    git_url: git@git.efficios.com:lttng-www.git
    git_credentials: 63a5abb5-9056-47e2-b419-f5946c1b8f08
    review: false
    review_project: lttng-www
    review_known_hosts: 3d4f07ac-260a-4b70-bae1-9974f30636ed
    review_git_url: ssh://jenkins@review.lttng.org:29418/lttng-www.git
    review_git_credentials: f3c907b6-7485-49e1-afe1-4df24fac4ca1
    version: master

- job:
    name: dev_review_lttng-www
    defaults: lttng-www
    review: true
    deploy_target: preprod

- job:
    name: lttng-www
    defaults: lttng-www
    publishers:
      - ircbot:
          strategy: statechange-only
          message-type: summary
          matrix-notifier: only-parent
      - email-ext:
          recipients: 'ci-notification@lists.lttng.org'
          reply-to: ci-notification@lists.lttng.org
          always: false
          unstable: false
          first-failure: true
          first-unstable: true
          not-built: false
          aborted: false
          regression: false
          failure: false
          second-failure: false
          improvement: false
          still-failing: false
          success: false
          fixed: false
          fixed-unhealthy: true
          still-unstable: false
          pre-build: false
          matrix-trigger: only-parent
          send-to:
            - recipients
