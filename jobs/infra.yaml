---

- defaults:
    name: infra
    concurrent: false
    description: |
      Job is managed by Jenkins Job Builder
    project-type: pipeline
    sandbox: true
    properties:
      - build-discarder:
          !include: common/default_discarder.yaml.inc
    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor

- job-template:
    name: '{prefix}infra_lttng-ci_{version}'
    defaults: infra
    concurrent: true
    dsl: !include-jinja2: pipelines/infra/lttng-ci.groovy.j2
    parameters: !j2-yaml: |
      - string:
          name: 'GIT_URL'
          default: 'https://github.com/lttng/lttng-ci'
      - string:
          name: 'GIT_BRANCH'
          default: '{version}'
      {% if review %}
      {% include 'common/review_parameters.yaml.inc' %}
      {% endif %}

    scm:
      - git:
          url: 'https://github.com/lttng/lttng-ci.git'
          branches:
            - origin/{version}
          basedir: src/lttng-ci
          skip-tag: true
    properties:
      !j2-yaml: |
            {% if review %}
            - build-discarder:
                !include: common/review_discarder.yaml.inc
            {% else %}
            - build-discarder:
                !include: common/default_discarder.yaml.inc
            {% endif %}
    triggers:
      - !j2-yaml: |
        {% if review %}
        gerrit:
          trigger-on:
            - comment-added-event:
                approval-category: 'CI-Build'
                approval-value: 1
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'lttng-ci'
              branches:
                - branch-compare-type: 'ANT'
                  branch-pattern: '{version}'
        {% else %}
        pollscm:
          cron: '@hourly'
        {% endif %}

    # job variables
    version:
      - master
    prefix: ''
    review: false

- job:
    name: 'infra_post_review_merge'
    defaults: infra
    project-type: pipeline
    concurrent: true
    dsl: !include-jinja2: pipelines/infra/post_review_merge.groovy.j2
    parameters: !j2-yaml: |
      - string:
          name: 'GIT_URL'
          default: 'https://github.com/lttng/lttng-ci'
      - string:
          name: 'GIT_BRANCH'
          default: '{version|master}'
      - bool:
          name: 'NOOP'
          default: false
      {% include 'common/review_parameters.yaml.inc' %}
      - string:
          name: 'GERRIT_EVENT_TYPE'
          default: ''
      - string:
          name: 'GERRIT_CHANGE_COMMIT_MESSAGE'
          default: ''
          description: 'Base64 encoded commit message'
      - string:
          name: 'GERRIT_CHANGE_URL'
          default: ''
    triggers:
      - gerrit:
          trigger-on:
            - change-merged-event
          projects:
            - project-compare-type: 'ANT'
              project-pattern: '*'
              branches:
                - branch-compare-type: 'ANT'
                  branch-pattern: '*'

- job:
    name: 'infra_system_clean'
    defaults: infra
    project-type: freestyle
    node: 'master'
    builders:
      - system-groovy:
          command: !include-raw-verbatim: scripts/infra/system_clean.groovy
          sandbox: true

    triggers:
      - timed: "H */2 * * *"

    parameters:
      - string:
          name: 'HOURS_TO_KEEP_SUCCESSFUL_BUILDS'
          default: '24'
          description: |
            The number of hours to keep successful builds. A value less than 0 will not delete successful builds.
      - string:
          name: 'JOB_PATTERN'
          default: 'dev_review_.*'
          description: 'The pattern to use to find jobs that should be cleaned'

- job:
    name: 'infra_incus_clean_images'
    defaults: infra
    dsl: !include-jinja2: pipelines/infra/incus_clean_images.groovy.j2
    parameters:
      - string:
          name: 'INCUS_HOST'
          default: 'ci-host-amd64-1a.internal.efficios.com'
      - credentials:
          name: 'INCUS_CLIENT_CERT_CREDENTIALS_ID'
          type: secretfile
          default: 'f3f08275-59ef-42ff-9de5-9beafc7435b8'
      - credentials:
          name: 'INCUS_CLIENT_KEY_CREDENTIALS_ID'
          type: secretfile
          default: '0debf23b-191b-4cdf-8a25-04e9a7092a67'
      - bool:
          name: NOOP
          default: false
          description: 'Enable to not actually delete images'
      - string:
          name: 'KEEP_YOUNGER_THAN_DAYS'
          default: '30'
          description: 'Keep un-aliases imaged if their upload date is more recent than N days ago'
    triggers:
      - timed: '@monthly'

- project:
    name: infra
    jobs:
      - '{prefix}infra_lttng-ci_{version}': {}
      - '{prefix}infra_lttng-ci_{version}':
          prefix: 'dev_review_'
          review: true

- view:
    name: 'Infra'
    view-type: list
    regex: '(infra|meta|images)[-_].*'
