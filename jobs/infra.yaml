---

- defaults:
    name: infra
    concurrent: false
    description: |
      Job is managed by Jenkins Job Builder
    project-type: pipeline
    sandbox: true
    properties:
      - build-discarder:
          !include: common/default_discarder.yaml.inc
    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor

- job:
    name: 'infra_system_clean'
    defaults: infra
    project-type: freestyle
    node: 'master'
    builders:
      - system-groovy:
          command: !include-raw-verbatim: scripts/infra/system_clean.groovy
          sandbox: true

    triggers:
      - timed: "H */2 * * *"

    parameters:
      - string:
          name: 'HOURS_TO_KEEP_SUCCESSFUL_BUILDS'
          default: '24'
          description: 'The number of hours to keep successful builds. A value less than 0 will not delete successful builds.'
      - string:
          name: 'JOB_PATTERN'
          default: 'dev_review_.*'
          description: 'The pattern to use to find jobs that should be cleaned'

- view:
    name: 'Infra'
    view-type: list
    regex: '(infra|meta)[-_].*'
