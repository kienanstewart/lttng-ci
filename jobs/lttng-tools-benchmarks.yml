---

- defaults:
    name: lttng-tools-benchmarks
    description: |

      <p>Job is managed by Jenkins Job Builder.</p>

    project-type: freestyle

    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor

    scm:
      - git:
          url: https://github.com/{github_user}/{github_name}.git
          browser: githubweb
          browser-url: https://github.com/{github_user}/{github_name}
          branches:
            - origin/{benchmark_version}
          basedir: src/{github_name}
          skip-tag: true

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=lttng-tools-benchmarks
      - build-discarder:
          !include: common/default_discarder.yaml.inc
      - github:
          url: https://github.com/{github_user}/{github_name}

    # Job variables
    github_user: lttng
    github_name: '{benchmark_project|lttng-tools-benchmarks}'
    benchmark_project: lttng-tools-benchmarks
    benchmark_version: main
    version:
      - 'master'

- job:
    name: lttng-tools-benchmarks
    defaults: lttng-tools-benchmarks
    project-type: pipeline
    sandbox: true
    triggers:
      - timed: '@daily'

    parameters: &lttng-tools-benchmarks-parameters
      - string:
          name: 'BABELTRACE_REPO'
          default: "https://github.com/efficios/babeltrace.git"
      - string:
          name: 'BENCHMARK_BATCH_SIZE'
          default: "10"
          description: "How many commits to test per lava run. 0 to test in a single run"
      - bool:
          name: 'BENCHMARK_DRY_RUN'
          default: false
          description: "Generate LAVA job descriptions, but do not submit them"
      - string:
          name: 'BENCHMARK_FILTER'
          default: "all"
          description: |
            (Regression check only) A comma-separated list of benchmarks to filter for, or 'all'.
            E.g. 'gen-tp.tracing_enabled.ns_per_event,sha2.tracing_enabled.ns_per_event'
      - bool:
          name: 'BENCHMARK_FORCE'
          default: false
          description: 'Force benchmarks to be re-run'
      - string:
          name: 'BENCHMARK_MAX_BATCHES'
          default: "0"
          description: "Maximum number of batches to run before ending job. 0 is all jobs"
      - bool:
          name: 'BENCHMARK_SKIP_ASV_GENERATION'
          default: false
          description: 'Skip generating ASV output'
      - bool:
          name: 'BENCHMARK_SKIP_PDF_GENERATION'
          default: false
          description: 'Skip generating PDF output'
      - bool:
          name: 'BENCHMARK_SKIP_SUBMISSION'
          default: false
          description: 'Skip running benchmarks'
      - string:
          name: 'BENCHMARK_STRIDE'
          default: '1'
          description: 'Run every Nth commit'
      - bool:
          name: 'BENCHMARK_TAGS_ONLY'
          default: true
          description: 'Limit benchmarked revisions to tags'
      - string:
          name: 'KERNEL_COMMIT_ID'
          description: 'Commit ID of the linux kernel to use'
          default: 'f6044d1fd846ed1ae457975738267214b538a222'  # v6.12.66
      - string:
          name: 'LAVA_HOST'
          default: 'lava-master-03.internal.efficios.com'
          description: 'The hostname of the LAVA instance'
      - choice:
          name: 'LAVA_PROTO'
          choices:
            - 'http'
            - 'https'
          description: 'The protocol to use with the LAVA host'
      - string:
          name: 'LAVA_USERNAME'
          default: 'lava-jenkins'
          description: 'The username to authenticate with the LAVA instance'
      - string:
          name: 'LTTNG_CI_REPO'
          default: 'https://github.com/lttng/lttng-ci.git'
          description: 'LTTng-ci git repo to checkout the CI scripts'
      - string:
          name: 'LTTNG_CI_BRANCH'
          default: 'master'
          description: 'The branch of the CI repository to clone for job scripts'
      - string:
          name: 'LTTNG_MODULES_REPO'
          default: 'https://github.com/lttng/lttng-modules.git'
      - string:
          name: 'LTTNG_TOOLS_REPO'
          default: 'https://github.com/lttng/lttng-tools.git'
      - string:
          name: 'LTTNG_UST_REPO'
          default: 'https://github.com/lttng/lttng-ust.git'
      - string:
          name: 'LTTNG_TOOLS_BENCHMARKS_REPO'
          default: 'https://github.com/lttng/lttng-tools-benchmarks.git'
      - string:
          name: 'LTTNG_TOOLS_BENCHMARKS_BRANCH'
          default: '{benchmark_version}'
      - string:
          name: 'NFS_ROOT_URL'
          default: 'https://obj-lava.internal.efficios.com/rootfs/rootfs_amd64_trixie_2026-05-26.tar.xz'
      - string:
          name: 'TAILLEUR_REPO'
          default: 'https://github.com/efficios/tailleur.git'
      - string:
          name: 'TAILLEUR_BRANCH'
          default: 'main'
      - string:
          name: 'S3_BASE_DIR'
          description: 'Base directory for the s3 object storage'
          default: ''
      - string:
          name: 'S3_BUCKET'
          description: 'Bucket for the s3 object storage'
          default: 'lava'
      - string:
          name: 'S3_HOST'
          description: 'Host for the s3 object storage'
          default: 'obj.internal.efficios.com'
      - string:
          name: 'S3_HTTP_BUCKET_URL'
          description: 'Base url to access the s3 bucket over unauthenticated HTTP'
          default: 'https://obj-lava.internal.efficios.com'
      - string:
          name: 'URCU_REPO'
          default: 'https://github.com/urcu/userspace-rcu.git'

    dsl: !include-jinja2: pipelines/lttng-tools/benchmark.groovy.j2

## Templates
- job-template:
    # The goal of this job is to run the benchmarks for the most recent
    # commit and compare to COMMIT~1 and the last tag (if any). The
    # job should warn or fail if there's a regression in any of the
    # benchmarks.
    name: 'lttng-tools_{version}_benchmark_regression'
    defaults: lttng-tools-benchmarks
    project-type: pipeline
    sandbox: true
    dsl: !include-jinja2: pipelines/lttng-tools/benchmark_regression.groovy.j2
    triggers:
      - pollscm:
          cron: "@hourly"

    parameters: *lttng-tools-benchmarks-parameters

## Project
- project:
    name: lttng-tools-benchmarks
    jobs:
      - 'lttng-tools_{version}_benchmark_regression':
          version:
            - stable-2.13
            - stable-2.14
            - stable-2.15
            - master
