---
## Anchors
- _system_tests_parameters_defaults: &system_tests_parameters_defaults
    name: 'system_tests_parameters_defaults'
    parameters:
      - string:
          name: 'BT_BRANCH'
          default: '{bt_branch}'
      - string:
          name: 'BT_REPO'
          default: 'git://git-mirror.internal.efficios.com/efficios/babeltrace.git'
          description: 'Babeltrace git repo to checkout'
      - string:
          name: 'BUILD_DEVICE'
          description: 'The lava device (e.g.: kvm, baremetal)'
          default: 'kvm'
      - string:
          name: 'CONFIGURE_DAX'
          description: 'Should the modules required for DAX be built? true/false'
          default: '{configure_dax}'
      - bool:
          name: 'FORCE_JOB_RUN'
          default: false
          description: |
            Force the child jobs to run regardless of if the last run with those parameters was a success or failure
      - bool:
          name: 'FORCE_FAILED_JOB_RUN'
          default: true
          description: 'Force the failed child jobs to run, even if the last run with those parameters failed'
      - string:
          name: 'KERNEL_COMMIT_ID'
          description: 'The linux kernel commit id to build against.'
      - string:
          name: 'KERNEL_REPO'
          default: 'git://git-mirror.internal.efficios.com/kernel/stable/linux-stable.git'
          description: 'Linux kernel git repo to checkout'
      - string:
          name: 'LAVA_HOST'
          default: 'lava-master-03.internal.efficios.com'
          description: 'The hostname of the LAVA instance'
      - choice:
          name: 'LAVA_PROTO'
          choices:
            - 'http'
            - 'https'
          description: 'The protocol to use with the LAVA host'
      - string:
          name: 'LAVA_USERNAME'
          default: 'lava-jenkins'
          description: 'The username to authenticate with the LAVA instance'
      - string:
          name: 'LTTNG_CI_BRANCH'
          default: 'master'
          description: 'The branch of the CI repository to clone for job scripts'
      - string:
          name: 'LTTNG_CI_REPO'
          default: 'https://github.com/lttng/lttng-ci.git'
          description: 'LTTng-ci git repo to checkout the CI scripts'
      - string:
          name: 'LTTNG_MODULES_COMMIT_ID'
          description: 'The lttng-modules commit id to build.'
      - string:
          name: 'LTTNG_MODULES_REPO'
          default: 'git://git-mirror.internal.efficios.com/lttng/lttng-modules.git'
          description: 'LTTng-Modules git repo to checkout'
      - string:
          name: 'LTTNG_TOOLS_COMMIT_ID'
          description: 'The lttng-tools commit id to build.'
      - string:
          name: 'LTTNG_TOOLS_REPO'
          default: 'git://git-mirror.internal.efficios.com/lttng/lttng-tools.git'
          description: 'LTTng-Tools git repo to checkout'
      - string:
          name: 'LTTNG_UST_COMMIT_ID'
          description: 'The lttng-ust commit id to build.'
      - string:
          name: 'LTTNG_UST_REPO'
          default: 'git://git-mirror.internal.efficios.com/lttng/lttng-ust.git'
          description: 'LTTng-UST git repo to checkout'
      - string:
          name: 'LTTNG_VERSION'
          description: 'The LTTng version string (e.g. stable-2.14)'
      - string:
          name: 'ROOTFS_URL'
          default: 'https://obj-lava.internal.efficios.com/rootfs/rootfs_amd64_trixie_2026-04-23.tar.xz'
          description: 'The URL at which the system root FS can be downloaded'
      - string:
          name: 'S3_BASE_DIR'
          description: 'Base directory for the s3 object storage'
          default: 'system-tests'
      - string:
          name: 'S3_BUCKET'
          description: 'Bucket for the s3 object storage'
          default: 'lava'
      - string:
          name: 'S3_HOST'
          description: 'Host for the s3 object storage'
          default: 'obj.internal.efficios.com'
      - string:
          name: 'S3_HTTP_BUCKET_URL'
          description: 'Base url to access the s3 bucket over unauthenticated HTTP'
          default: 'https://obj-lava.internal.efficios.com'
      - string:
          name: 'URCU_BRANCH'
          default: '{urcu_branch}'
      - string:
          name: 'URCU_REPO'
          default: 'git://git-mirror.internal.efficios.com/lttng/userspace-rcu.git'
          description: 'UserspaceRCU git repo to checkout'

- _system_tests_email_ext_defaults: &system_tests_email_ext_defaults
    recipients: '{email_to}'
    reply-to: ci-notification@lists.lttng.org
    always: false
    unstable: false
    first-failure: true
    first-unstable: true
    not-built: false
    aborted: false
    regression: false
    failure: false
    second-failure: false
    improvement: false
    still-failing: false
    success: false
    fixed: false
    fixed-unhealthy: true
    still-unstable: false
    pre-build: false
    matrix-trigger: only-parent
    send-to:
      - recipients

- defaults:
    name: system-tests-defaults
    project-type: freestyle
    node: 'deb13-amd64'
    scm:
      - git:
          url: "${{LTTNG_CI_REPO}}"
          basedir: src/lttng-ci/
          branches:
            - "${{LTTNG_CI_BRANCH}}"

    <<: *system_tests_parameters_defaults

    properties:
      - build-discarder:
          !include: common/default_discarder.yaml.inc

    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor

    publishers:
      - archive:
          artifacts: 'results/**'
          allow-empty: true
      - workspace-cleanup
      - email-ext:
          <<: *system_tests_email_ext_defaults

    # job variables
    bt_branch: 'master'
    configure_dax: 'false'
    email_to: ''
    prefix: ''
    suffix: ''
    urcu_branch: 'master'

- job-template:
    name: '{prefix}system_tests-{lttngversion}{suffix}'
    defaults: system-tests-defaults
    description: |
      Run system tests on Lava with LTTng {lttngversion}
    project-type: pipeline
    sandbox: true
    dsl: !include-jinja2: pipelines/system-tests/pipeline.groovy.j2

    triggers:
      - timed: '@weekly'

    # Job variables
    build_device:
      - baremetal
      - kvm
    lava_job: 'system_tests_run_lava_job'
    modules_job: "system_tests_build_kernel_and_modules"
    canary:
      linuxBranch: 'linux-6.12.y'
      linuxCommit: 'a9152eb181adaac576e8ac1ab79989881e0f301b'  # v6.12.51
      lttngBranch: 'stable-2.14'
      toolsCommit: '1c76ceab22ac87269c37800bb6a47bd9c0039ae1'  # v2.14.x
      modulesCommit: '6826c7f85f59567cffd99fd679f3a32b08ce20e6'  # v2.14.2
      ustCommit: '0c8cb8ea5394f057e15bcc033efa468a8f0b0f55'  # v2.14.0
      urcuBranch: 'v0.15.3'
      btBranch: 'v2.1.2'
    kversion:
      - linux-6.12.y
      - linux-6.6.y
      - linux-6.1.y
      - linux-5.15.y
      - linux-5.10.y
      - linux-4.4.y
    prefix: ''
    suffix: ''

- job-template:
    # This job should be throttled by the pipelines that execute it
    name: system_tests_run_lava_job
    defaults: system-tests-defaults
    concurrent: true
    description: |
      Run an LTTng system test on Lava
    builders:
      # Launch the test, but do not wait for completion
      - shell: !include-raw-verbatim: scripts/system-tests/run-lava-tests.sh
    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor
      - credentials-binding:
          - text:
              credential-id: jenkins_lava2_key
              variable: LAVA2_JENKINS_TOKEN
          - username-password-separated:
              credential-id: s3_obj_lava_key
              username: S3_ACCESS_KEY
              password: S3_SECRET_KEY
    properties:
      - build-discarder:
          days-to-keep: 7

- job-template:
    name: system_tests_build_kernel_and_modules
    defaults: system-tests-defaults
    concurrent: true
    description: |
      Built a Linux kernel and LTTng-modules for Lava system tests
    builders:
      # Build the kernel and modules and upload to object storage
      - shell: !include-raw-verbatim: scripts/system-tests/build-kernel-param.sh
    wrappers:
      - workspace-cleanup
      - timestamps
      - ansicolor
      - credentials-binding:
          - username-password-separated:
              credential-id: s3_obj_lava_key
              username: S3_ACCESS_KEY
              password: S3_SECRET_KEY
    properties:
      - build-discarder:
          days-to-keep: 7

## Project
- project:
    name: system-tests
    email_to: 'kstewart@efficios.com,jgalar@efficios.com'
    bt_branch: stable-2.1
    lttngversion:
      - stable-2.16
      - stable-2.15
      - stable-2.14
    urcu_branch: stable-0.15
    jobs:
      - '{prefix}system_tests-{lttngversion}{suffix}':
          bt_branch: master
          lttngversion:
            - master
          urcu_branch: master
      - '{prefix}system_tests-{lttngversion}{suffix}'
      - '{prefix}system_tests-{lttngversion}{suffix}':
          bt_branch: stable-2.0
          lttngversion:
            - stable-2.13
      - 'system_tests_build_kernel_and_modules':
          email_to: ''
      - 'system_tests_run_lava_job':
          email_to: ''

- project:
    name: system-tests-dax
    email_to: 'kstewart@efficios.com,jgalar@efficios.com'
    bt_branch: stable-2.1
    build_device:
      - kvm
    configure_dax: 'true'
    kversion:
      - linux-5.10.y
      - linux-5.15.y
      - linux-6.1.y
      - linux-6.6.y
      - linux-6.12.y
    lttngversion:
      - stable-2.16
      - stable-2.15
      - stable-2.14
      - stable-2.13
    suffix: '_dax'
    urcu_branch: stable-0.15
    jobs:
      - '{prefix}system_tests-{lttngversion}{suffix}':
          bt_branch: 'master'
          lttngversion:
            - master
          urcu_branch: 'master'
      - '{prefix}system_tests-{lttngversion}{suffix}'

## Views
- view-template:
    name: 'System tests'
    view-type: list
    regex: 'system_.*'

- project:
    name: system-tests-views
    views:
      - 'System tests'
